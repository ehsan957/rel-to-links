<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 772px; height: 250px; overflow: hidden; }
  body {
    background: linear-gradient(120deg, #1e3a8a 0%, #2563eb 100%);
    font-family: "Segoe UI", Arial, sans-serif;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 36px;
    padding: 0 48px;
    box-sizing: border-box;
  }
  img { width: 150px; height: 150px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.25); flex: none; }
  h1 { margin: 0 0 6px; font-size: 46px; font-weight: 700; letter-spacing: -.5px; }
  p { margin: 0 0 18px; font-size: 18px; opacity: .9; }
  code {
    display: inline-block;
    font-family: Consolas, "Courier New", monospace;
    font-size: 16px;
    background: rgba(15, 23, 42, .55);
    padding: 8px 14px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .t { color: #93c5fd; } .a { color: #e2e8f0; } .v { color: #fbbf24; font-weight: 700; }
</style>
</head>
<body>
  <img src="icon.svg" alt="">
  <div>
    <h1>Rel for Links</h1>
    <p>nofollow, sponsored, ugc &amp; more for your menu links</p>
    <code><span class="t">&lt;a</span> <span class="a">href="…"</span> <span class="a">rel=</span><span class="v">"nofollow sponsored"</span><span class="t">&gt;</span></code>
  </div>
</body>
</html>
